version: 2

models:
  - name: stg_tlc__trips
    description: >
      Cleaned yellow-cab trips, one row per trip record. Reads the TLC's published
      Parquet files **in place** from CloudFront — nothing is copied into the
      warehouse. The file list is generated by `tlc_parquet_paths()` from the
      `start_month` / `end_month` vars, because CloudFront rejects wildcard requests
      (HTTP 403) and a glob is therefore not an option.
    meta:
      grain: one row per completed trip
      upstream: NYC TLC yellow_tripdata Parquet, monthly, public
    columns:
      - name: trip_sk
        description: Surrogate key hashed from the natural trip tuple.
        tests: [unique, not_null]
      - name: pickup_at
        description: Meter engaged timestamp, local New York time.
        tests: [not_null]
      - name: dropoff_at
        tests: [not_null]
      - name: pickup_zone_id
        description: TLC Taxi Zone where the trip started.
        tests: [not_null]
      - name: total_amount_usd
        description: Total charged to the passenger, including taxes, tolls and tips.
        tests: [not_null]
      - name: trip_distance_mi
        description: Elapsed trip distance in miles as reported by the taximeter.
      - name: payment_type_id
        description: "1 = credit card, 2 = cash, 3 = no charge, 4 = dispute, 5 = unknown, 6 = voided."

  - name: stg_tlc__zones
    description: >
      TLC taxi zone lookup, one row per LocationID. Sourced from a seed so the
      dimension is version-controlled and reproducible.
    columns:
      - name: zone_id
        tests: [unique, not_null]
